# --- 1. Sticky Mode Logic ---
# Set escape-time to 0 so 'Esc' exits the mode instantly without lag
set -s escape-time 0
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Change prefix
unbind C-s
set -g prefix C-s

# Bind your prefix (C-s) in the ROOT table to jump straight into sticky mode.
# This allows: C-s -> c -> c -> Esc
# bind-key -n C-s switch-client -T sticky-mode

# Bind commands within sticky-mode
# We stay in sticky-mode by ending every command with 'switch-client -T sticky-mode'
bind  c new-window \; switch-client -T prefix
bind % split-window -h \; switch-client -T prefix
bind '"' split-window -v \; switch-client -T prefix
bind n next-window \; switch-client -T prefix
bind p previous-window \; switch-client -T prefix

bind c new-window \; switch-client -T prefix

# Navigation inside sticky mode (so you can navigate while "sticky")
bind h select-pane -L 
bind j select-pane -D
bind k select-pane -U 
bind l select-pane -R

# Exit sticky-mode
bind-key -T sticky-mode Escape switch-client -T root

# --- 2. General Settings ---
set -g mouse on
set -g default-terminal "tmux-256color"
# set -g allow-passthrough on
set -gq allow-passthrough all
set-option -g status-position top
unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# --- 3. Plugins & Theme ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# set -g @catppuccin_status_background "none"
set -g status-bg default
# set -g status-style bg=default

run '~/.tmux/plugins/tmux/catppuccin.tmux'

# --- 4. Status Bar (The Fix) ---
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_directory} "

# First, define the base status-right
set -g status-right "#{E:@catppuccin_status_session}"

# Finally, append other info
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
